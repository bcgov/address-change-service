apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: "${APP_NAME}-config-template"
labels:
  template: "${APP_NAME}-config-template"
parameters:
  - name: APP_NAME
    description: Application name used to identify the ConfigMap
    required: true
  - name: ROOT_LOG_LEVEL
    description: Default log threshold (TRACE, DEBUG, INFO, WARN, ERROR, OFF)
    value: "INFO"
  - name: APP_LOG_LEVEL
    description: Address Change application log threshold
    value: "INFO"
  - name: SPRING_WEB_LOG_LEVEL
    description: Spring Web log threshold
    value: "INFO"
  - name: SPRING_BOOT_AUTOCONFIG_LOG_LEVEL
    description: Spring Boot auto-configuration logging threshold
    value: "INFO"
  - name: SERVICE_ENVIRONMENT
    description: Deployment environment (DEV, TEST, PROD) for ECS service.environment
    required: true
  - name: ENABLE_FLYWAY
    description: Whether the application runs Flyway migrations during startup
    value: "false"
  - name: DATABASE_HOST
    description: PostgreSQL primary service name
    value: "address-change-db-patroni"
  - name: DATABASE_PORT
    description: PostgreSQL service port
    value: "5432"
  - name: DATABASE_NAME
    description: Address Change PostgreSQL database
    value: "address_change"
  - name: DATABASE_SCHEMA
    description: Address Change PostgreSQL schema managed by Flyway
    value: "address_change"
  - name: DATABASE_SSL_MODE
    description: PostgreSQL SSL mode
    value: "require"
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "${APP_NAME}-config"
      labels:
        app: "${APP_NAME}"
    data:
      SERVICE_ENVIRONMENT: "${SERVICE_ENVIRONMENT}"
      ROOT_LOG_LEVEL: "${ROOT_LOG_LEVEL}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL}"
      SPRING_WEB_LOG_LEVEL: "${SPRING_WEB_LOG_LEVEL}"
      SPRING_BOOT_AUTOCONFIG_LOG_LEVEL: "${SPRING_BOOT_AUTOCONFIG_LOG_LEVEL}"
      ENABLE_FLYWAY: "${ENABLE_FLYWAY}"
      DATABASE_HOST: "${DATABASE_HOST}"
      DATABASE_PORT: "${DATABASE_PORT}"
      DATABASE_NAME: "${DATABASE_NAME}"
      DATABASE_SCHEMA: "${DATABASE_SCHEMA}"
      DATABASE_SSL_MODE: "${DATABASE_SSL_MODE}"
