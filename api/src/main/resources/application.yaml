spring:
  main:
    banner-mode: console
  application:
    name: address-change-api
    version: "@project.version@"
  flyway:
    enabled: ${ENABLE_FLYWAY:false}
    url: "jdbc:postgresql://${DATABASE_HOST:address-change-db-patroni}:${DATABASE_PORT:5432}/${DATABASE_NAME:address_change}?sslmode=${DATABASE_SSL_MODE:require}"
    user: ${FLYWAY_USERNAME:}
    password: ${FLYWAY_PASSWORD:}
    locations: classpath:db/migration
    default-schema: ${DATABASE_SCHEMA:address_change}
    schemas: ${DATABASE_SCHEMA:address_change}
    create-schemas: false
    clean-disabled: true
    validate-migration-naming: true
    validate-on-migrate: true
    connect-retries: 10
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    ca.bc.gov.addresschange.api: ${APP_LOG_LEVEL:${ROOT_LOG_LEVEL:INFO}}
    org.springframework.web: ${SPRING_WEB_LOG_LEVEL:${ROOT_LOG_LEVEL:INFO}}
    org.springframework.boot.autoconfigure.logging: ${SPRING_BOOT_AUTOCONFIG_LOG_LEVEL:${ROOT_LOG_LEVEL:INFO}}
  structured:
    format:
      console: ca.bc.gov.addresschange.api.logging.EcsLogFormatter
    ecs:
      service:
        id: ${SERVICE_ID:address-change-api}
        version: ${SERVICE_VERSION:${spring.application.version}}
        environment: ${SERVICE_ENVIRONMENT:LOCAL}
